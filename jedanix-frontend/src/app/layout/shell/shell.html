<mat-toolbar color="primary">
  <a routerLink="/" class="marca">JEDANIX</a>

  <nav class="menu" aria-label="Navegación principal">
    @for (item of menu(); track item.ruta) {
      <a class="item-menu" [routerLink]="item.ruta" routerLinkActive="activo" [title]="item.etiqueta">
        <mat-icon>{{ item.icono }}</mat-icon>
        <span class="etiqueta-menu">{{ item.etiqueta }}</span>
      </a>
    }
  </nav>

  <span class="espaciador"></span>

  @if (authService.usuario(); as usuario) {
    <span class="usuario-info">{{ usuario.nombreCompleto }} · {{ nombreRol() }}</span>
  }
  <a mat-icon-button routerLink="/perfil" aria-label="Mi perfil" title="Mi perfil">
    <mat-icon>account_circle</mat-icon>
  </a>
  <button
    mat-icon-button
    type="button"
    (click)="cerrarSesion()"
    aria-label="Cerrar sesión"
    title="Cerrar sesión"
  >
    <mat-icon>logout</mat-icon>
  </button>
</mat-toolbar>

<main class="contenido">
  <router-outlet></router-outlet>
</main>
