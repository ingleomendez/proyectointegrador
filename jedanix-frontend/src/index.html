<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>JEDANIX · Gestión de prácticas</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/icon?family=Material+Symbols+Outlined"
      rel="stylesheet"
    />
    <!-- Aplica el modo oscuro antes de que Angular arranque (evita un destello claro). -->
    <script>
      (function () {
        try {
          var guardado = localStorage.getItem('jedanix-tema');
          var oscuro = guardado
            ? guardado === 'oscuro'
            : window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (oscuro) document.documentElement.classList.add('tema-oscuro');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
